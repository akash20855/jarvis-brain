fallback:
  # Use pattern-based analysis when AI is unavailable
  enabled: true
  analysis_rules:
    - "Suggest list comprehensions for append loops"
    - "Flag eval/exec for security"
    - "Warn about functions over 100 lines"
    - "Suggest type hints"
