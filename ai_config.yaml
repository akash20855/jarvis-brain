# Jarvis Brain - AI Configuration
# Edit this file to customize your AI services

ai:
  # Code Analysis AI Service
  code_analysis:
    enabled: true
    type: "ollama"  # ollama, openai, anthropic, local, custom
    url: "http://host.docker.internal:11434"  # Change to localhost:11434 if not using Docker
    model: "mistral"
    timeout: 30
    description: "Analyzes code and suggests improvements"
  
  # Chat AI Service
  chat:
    enabled: true
    type: "ollama"
    url: "http://host.docker.internal:11435"
    model: "neural-chat"
    timeout: 30
    description: "Conversational assistant for coding help"
  
  # Suggestion Generator AI
  suggestions:
    enabled: true
    type: "ollama"
    url: "http://host.docker.internal:11436"
    model: "mistral"
    timeout: 30
    description: "Generates code improvement suggestions"

# Alternative AI providers (uncomment to use)
#
# ======================================
# 🧠 CLAUDE HAIKU 4.5 (BUILT-IN FOR CODING)
