version: '3.8'

services:
  # Backend API (Flask)
  jarvis-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: jarvis-backend
    ports:
      - "8000:8000"
    environment:
      - FLASK_ENV=development
      - PYTHONUNBUFFERED=1
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_CHAT_URL=http://host.docker.internal:11435
      - OLLAMA_SUGGESTIONS_URL=http://host.docker.internal:11436
    volumes:
      - .:/workspace
    working_dir: /workspace/backend
    command: python3 app.py
    depends_on:
      - ollama-analysis
      - ollama-chat
      - ollama-suggestions
    networks:
      - jarvis-network
    restart: unless-stopped

  # Frontend (React)
  jarvis-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jarvis-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000/api
    depends_on:
      - jarvis-backend
    networks:
      - jarvis-network
    restart: unless-stopped

  # Code Analysis AI (Ollama Instance 1)
  ollama-analysis:
    image: ollama/ollama:latest
    container_name: ollama-analysis
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    volumes:
      - ollama-analysis-data:/root/.ollama
    command: serve
    networks:
      - jarvis-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Chat AI (Ollama Instance 2)
  ollama-chat:
    image: ollama/ollama:latest
    container_name: ollama-chat
    ports:
      - "11435:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    volumes:
      - ollama-chat-data:/root/.ollama
    command: serve
    networks:
      - jarvis-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Suggestion Generator AI (Ollama Instance 3)
  ollama-suggestions:
    image: ollama/ollama:latest
    container_name: ollama-suggestions
    ports:
      - "11436:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    volumes:
      - ollama-suggestions-data:/root/.ollama
    command: serve
    networks:
      - jarvis-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Data Storage (Redis)
  redis:
    image: redis:7-alpine
    container_name: jarvis-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - jarvis-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Database (PostgreSQL)
  postgres:
    image: postgres:15-alpine
    container_name: jarvis-postgres
    environment:
      POSTGRES_DB: jarvis_brain
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: jarvis_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - jarvis-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ollama-analysis-data:
  ollama-chat-data:
  ollama-suggestions-data:
  redis-data:
  postgres-data:

networks:
  jarvis-network:
    driver: bridge
